name: TAC board sync

# Two jobs in one workflow, picked by which schedule fired:
#   every 10 minutes  -> "sync": post the LF Onboarding / In Voting / moved-to-Agenda / Scheduled Date messages
#   06:00 UTC nightly -> "nightly-move": put items in the right Agenda column by Scheduled Date
#                        (runs before the 07:00 UTC LFX data refresh so the site data picks it up)
#
# GitHub Actions has no trigger for a card moving between columns on an org project, so "sync" polls the
# board. Each comment carries a hidden marker and is never posted twice. See .github/scripts/tac-automation.mjs.
#
# Try it safely: Actions > TAC board sync > Run workflow (dry run is on by default and only prints what it would do).

on:
  schedule:
    - cron: '*/10 * * * *'
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options: [sync, nightly-move]
        default: sync
      dry_run:
        description: Only print what would happen (no comments, no board changes)
        type: boolean
        default: true
      backfill:
        description: "sync only: also consider items that have not changed recently (use once to catch up existing items)"
        type: boolean
        default: false

permissions:
  contents: read

# A newer queued run replaces an older queued one; that is fine because the next poll catches up.
concurrency:
  group: tac-board-sync
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    steps:
      - name: Pick mode
        id: mode
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: |
          if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "0 6 * * *" ]; then
            mode=nightly-move
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            mode="$INPUT_MODE"
          else
            mode=sync
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github

      - name: Run
        run: node .github/scripts/tac-automation.mjs "$MODE"
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Scheduled runs are live; manual runs use the inputs above (dry run by default).
          DRY_RUN: ${{ inputs.dry_run }}
          BACKFILL: ${{ inputs.backfill }}
